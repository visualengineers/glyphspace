name: CI and deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege by default; only the deploy job may publish to Pages.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (a tag can be moved); Dependabot keeps them current.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      # Only the packages that reach users; Dependabot looks after the dev dependencies.
      - name: 🛡️ Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # angular.json sets maxWarnings to 0, so warnings fail too.
      - name: 🔍 Lint
        run: npm run lint

      - name: 💅 Check formatting
        run: npm run format:check

      - name: 🧰 Tool tests
        run: npm run test:tools

      # Vitest runs the unit tests in Playwright's headless Chromium (version pinned by package-lock).
      # Not cached on purpose: Playwright advises against it, restoring takes about as long as the
      # download, and --with-deps has to install the Linux system packages either way.
      - name: 🎭 Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # The test command lives in package.json ("test:ci") so the runner can be swapped in one place.
      - name: 🧪 Unit tests
        run: npm run test:ci
        env:
          # The runner image points CHROME_BIN at its own Google Chrome, which the Angular test
          # builder would launch instead of the pinned Playwright Chromium.
          CHROME_BIN: ''

      # The Python wheels of the self-hosted Pyodide (about 27 MB, ADR 0013). `npm run build`
      # downloads what the cache lacks and checks every wheel against pyodide-lock.json.
      - name: 🐍 Cache Pyodide packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pyodide-packages
          key: pyodide-packages-${{ hashFiles('node_modules/pyodide/pyodide-lock.json', 'src/app/workers/pyodide-packages.json') }}

      - name: 🛠️ Build Angular app
        run: npm run build -- --base-href=/glyphspace/ --configuration production

      # The builder writes the licence list next to browser/, which is the only folder published.
      - name: 📜 Publish third-party licences
        run: cp dist/glyphspace/3rdpartylicenses.txt dist/glyphspace/browser/

      - name: 📤 Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/glyphspace/browser/
          retention-days: 1

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: python-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python 3.14, as in Pyodide; requirements-dev.txt pins Pyodide's package versions.
      - name: 🐍 Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 📦 Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: 🧪 Python tests
        run: python -B -m pytest -p no:cacheprovider tools/tests

  deploy:
    needs: [verify, python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publishes the Pages artifact; needs no write access to the repository.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
