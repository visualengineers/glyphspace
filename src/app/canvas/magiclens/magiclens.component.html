<canvas
  #lensCanvas
  id="lens-canvas"
  [hidden]="!magicLensActive"
  [width]="lensDiameter"
  [height]="lensDiameter"
  style="
    position: absolute;
    border-radius: 50%;
    border: 2px solid black;
    pointer-events: none;
    background: white;
    z-index: 10;
  "
>
</canvas>
<div
  class="lens-indicator"
  [style.left.px]="relativePosition.x - indicatorRadius"
  [style.top.px]="relativePosition.y - indicatorRadius"
  [style.width.px]="indicatorRadius * 2"
  [style.height.px]="indicatorRadius * 2"
  [hidden]="!magicLensActive"
></div>
