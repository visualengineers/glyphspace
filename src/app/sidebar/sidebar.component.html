<div class="sidebar-clip">
  <div class="panel" id="sidebar-panel">
    <header class="header">
      <div class="header-row">
        <h2 class="title">Glyph legend · {{ legendCount }}</h2>
        <button
          #collapseButton
          type="button"
          class="collapse"
          aria-label="Hide sidebar"
          title="Hide sidebar"
          aria-controls="sidebar-panel"
          [attr.aria-expanded]="!collapsed"
          (click)="collapse()"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="M6 6l6 6-6 6M13 6l6 6-6 6" />
          </svg>
        </button>
      </div>

      <app-glyph-legend
        [glyphType]="glyphConfig.glyphType"
        [axes]="axes"
        [featureIds]="featureIds"
        [labels]="labels"
        [axisLengths]="legendLengths"
        [color]="legendColor"
        (axisAdded)="addAxis($event)"
        (axisRemoved)="removeAxis($event)"
      />

      <app-filter-summary [labels]="labels" />
    </header>

    <div class="tablist" role="tablist" aria-label="Sidebar sections">
      @for (tab of tabs; track tab.id; let i = $index) {
        <button
          type="button"
          role="tab"
          class="tab"
          [id]="'sidebar-tab-' + tab.id"
          [attr.aria-selected]="activeTab === tab.id"
          [attr.aria-controls]="'sidebar-tabpanel-' + tab.id"
          [attr.tabindex]="activeTab === tab.id ? 0 : -1"
          (click)="selectTab(tab.id)"
          (keydown)="onTabKeydown($event, i)"
        >
          {{ tab.label }}
        </button>
      }
    </div>

    <!-- Both tabs stay mounted so the histogram filters keep their state. -->
    <div
      class="tab-panel"
      role="tabpanel"
      id="sidebar-tabpanel-filters"
      aria-labelledby="sidebar-tab-filters"
      [hidden]="activeTab !== 'filters'"
    >
      <app-filters-tab
        [features]="features"
        [featureIds]="featureIds"
        [labels]="labels"
        [types]="types"
        [axes]="axes"
        [glyphType]="glyphConfig.glyphType"
        (axisAdded)="addAxis($event)"
        (axisRemoved)="removeAxis($event)"
      />
    </div>
    <div
      class="tab-panel"
      role="tabpanel"
      id="sidebar-tabpanel-encoding"
      aria-labelledby="sidebar-tab-encoding"
      [hidden]="activeTab !== 'encoding'"
    >
      <app-encoding-tab
        [featureIds]="featureIds"
        [labels]="labels"
        [types]="types"
        [categoryCounts]="categoryCounts"
        [glyphConfig]="glyphConfig"
      />
    </div>
  </div>
</div>

<button
  #expandButton
  type="button"
  class="edge-handle"
  aria-label="Show sidebar"
  title="Show sidebar"
  aria-controls="sidebar-panel"
  [attr.aria-expanded]="!collapsed"
  (click)="expand()"
>
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
    <path d="M18 6l-6 6 6 6M11 6l-6 6 6 6" />
  </svg>
</button>
