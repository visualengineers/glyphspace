<nav class="progress-stepper" [class.vertical]="vertical" aria-label="Wizard steps">
  <ol class="stepper-container">
    @for (step of steps; track $index) {
      <li class="step-wrapper">
        <!-- Unreachable steps are disabled so they are no Tab stops; the name is the label
             (+ "completed"), the purpose/summary line is the description. -->
        <button
          type="button"
          class="step"
          [class.active]="isStepActive($index)"
          [class.completed]="isStepCompleted($index)"
          [class.clickable]="isStepClickable($index)"
          [disabled]="!isStepClickable($index)"
          [attr.aria-current]="isStepActive($index) ? 'step' : null"
          [attr.aria-labelledby]="labelId($index)"
          [attr.aria-describedby]="stepDetail($index) ? detailId($index) : null"
          (click)="onStepClick($index)"
        >
          <span class="step-circle" aria-hidden="true">
            @if (isStepCompleted($index) && !isStepActive($index)) {
              <span class="material-icons" aria-hidden="true">check</span>
            } @else {
              <span class="step-number">{{ $index + 1 }}</span>
            }
          </span>

          <span class="step-text">
            <span class="step-label" [id]="labelId($index)">
              {{ step.label }}
              @if (isStepCompleted($index)) {
                <span class="visually-hidden">(completed)</span>
              }
            </span>
            @if (stepDetail($index); as detail) {
              <span
                class="step-description"
                [class.step-summary]="showsSummary($index)"
                [id]="detailId($index)"
                [attr.title]="showsSummary($index) ? detail : null"
                >{{ detail }}</span
              >
            }
          </span>
        </button>

        @if ($index < steps.length - 1) {
          <span class="step-connector" aria-hidden="true" [class.completed]="isStepCompleted($index + 1)"></span>
        }
      </li>
    }
  </ol>
</nav>
