<svg [attr.width]="width" [attr.height]="height" class="box-plot">
  <!-- Left whisker -->
  <line
    [attr.x1]="whiskerLeftPos"
    [attr.y1]="height / 2"
    [attr.x2]="boxLeft"
    [attr.y2]="height / 2"
    [attr.stroke]="color"
    stroke-width="1.5"
    class="whisker"
  >
    <title>Min: {{ formatValue(min) }}</title>
  </line>

  <!-- Right whisker -->
  <line
    [attr.x1]="boxLeft + boxWidth"
    [attr.y1]="height / 2"
    [attr.x2]="whiskerRightPos"
    [attr.y2]="height / 2"
    [attr.stroke]="color"
    stroke-width="1.5"
    class="whisker"
  >
    <title>Max: {{ formatValue(max) }}</title>
  </line>

  <!-- Box (Q1 to Q3) -->
  <rect
    [attr.x]="boxLeft"
    [attr.y]="boxY"
    [attr.width]="boxWidth"
    [attr.height]="boxHeight"
    [attr.fill]="color"
    fill-opacity="0.2"
    [attr.stroke]="color"
    stroke-width="1.5"
    class="box"
  >
    <title>Q1: {{ formatValue(q1) }} | Q3: {{ formatValue(q3) }}</title>
  </rect>

  <!-- Median line -->
  <line
    [attr.x1]="medianPos"
    [attr.y1]="boxY"
    [attr.x2]="medianPos"
    [attr.y2]="boxY + boxHeight"
    [attr.stroke]="color"
    stroke-width="2"
    class="median"
  >
    <title>Median: {{ formatValue(median) }}</title>
  </line>

  <!-- Mean marker (circle) -->
  @if (meanPos !== undefined) {
    <circle [attr.cx]="meanPos" [attr.cy]="height / 2" r="3" [attr.fill]="color" class="mean">
      <title>Mean: {{ formatValue(mean) }}</title>
    </circle>
  }

  <!-- Min cap -->
  <line
    [attr.x1]="whiskerLeftPos"
    [attr.y1]="boxY + 4"
    [attr.x2]="whiskerLeftPos"
    [attr.y2]="boxY + boxHeight - 4"
    [attr.stroke]="color"
    stroke-width="1.5"
    class="whisker-cap"
  />

  <!-- Max cap -->
  <line
    [attr.x1]="whiskerRightPos"
    [attr.y1]="boxY + 4"
    [attr.x2]="whiskerRightPos"
    [attr.y2]="boxY + boxHeight - 4"
    [attr.stroke]="color"
    stroke-width="1.5"
    class="whisker-cap"
  />

  <!-- Min label -->
  <text
    [attr.x]="whiskerLeftPos"
    [attr.y]="height - 2"
    class="axis-label"
    text-anchor="middle"
    [attr.fill]="color"
    font-size="9"
  >
    {{ formatShortValue(min) }}
  </text>

  <!-- Max label -->
  <text
    [attr.x]="whiskerRightPos"
    [attr.y]="height - 2"
    class="axis-label"
    text-anchor="middle"
    [attr.fill]="color"
    font-size="9"
  >
    {{ formatShortValue(max) }}
  </text>
</svg>
