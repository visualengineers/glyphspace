<div class="help-tooltip-container">
  <button
    #trigger
    class="help-icon"
    type="button"
    [attr.aria-label]="ariaLabel"
    [attr.aria-describedby]="tooltipId"
    [attr.aria-expanded]="isVisible"
    (mouseenter)="popup.onTriggerEnter()"
    (mouseleave)="popup.onPointerLeave()"
    (focus)="popup.onFocus()"
    (blur)="popup.onBlur()"
    (click)="popup.onClick()"
  >
    <span class="material-icons" aria-hidden="true">help_outline</span>
  </button>

  <!-- Always rendered (hidden while closed) so aria-describedby resolves. -->
  <div
    #tooltip
    class="tooltip-content"
    role="tooltip"
    [id]="tooltipId"
    [class.visible]="isVisible"
    [ngStyle]="tooltipStyle"
    (mouseenter)="popup.onPopupEnter()"
    (mouseleave)="popup.onPointerLeave()"
  >
    <div class="tooltip-text" [innerHTML]="helpText"></div>
  </div>
</div>
